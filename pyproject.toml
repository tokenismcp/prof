[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prof"
version = "0.1.0"
description = "PROF — Proof-Required Operation Framework. Think Freely. Act With Proof."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai-agents", "mcp", "authorization", "zero-trust", "ed25519", "policy-engine", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cryptography>=40",
  "pydantic>=2",
  "click>=8",
  "fastapi>=0.100",
  "uvicorn>=0.20",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.1", "httpx>=0.25"]
mcp = ["mcp>=1.0"]

[project.scripts]
prof = "prof.cli:main"
prof-gateway = "prof.server:serve"
prof-mcp = "prof.mcpd:serve_stdio"

[tool.setuptools.packages.find]
where = ["."]
include = ["prof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
