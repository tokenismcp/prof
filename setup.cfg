[metadata]
name = prof
version = 1.0.0
description = PROF — Proof-Required Operation Framework. Think Freely. Act With Proof.
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE, COMMERCIAL-LICENSE.md
classifiers =
    Programming Language :: Python :: 3
    License :: Other/Proprietary License
    Topic :: Security
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
python_requires = >=3.9
packages = find:
install_requires =
    cryptography>=40
    pydantic>=2
    click>=8
    fastapi>=0.100
    uvicorn>=0.20
    pyyaml>=6

[options.packages.find]
where = .
include = prof*

[options.package_data]
prof = console/*

[options.entry_points]
console_scripts =
    prof = prof.cli:main
    prof-gateway = prof.server:serve
    prof-mcp = prof.mcpd:serve_stdio
