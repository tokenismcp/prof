name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m prof demo
      - run: python examples/01_tool_call.py
      - run: python examples/02_file_modify.py
      - run: python examples/03_payment_request.py
